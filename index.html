<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idresshair by Jurga — Services</title>
   <meta property="og:title" content="idresshair by Jurga — Services">
<meta property="og:description" content="Hair Personally Addressed">
<meta property="og:image" content="https://idresshair.netlify.app/menu-new-image.png">
<meta property="og:url" content="https://idresshair.netlify.app/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allison&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STYLE MATCHED TO idresshair.simplybook.me (bookingtroll theme)
   COLORS — edit these lines to change the whole site's palette
   ============================================================ */
:root{
  --ink:#333333;       /* main text  (SimplyBook dark_font_color) */
  --ink-2:#332F2D;     /* serif heading text on booking page */
  --muted:#6f6a66;     /* descriptions, secondary text */
  --line:#e5d9ce;      /* thin dividing lines / card borders */
  --soft:#ede3d7;      /* beige band (SimplyBook sb_available) */
  --paper:#ffffff;     /* page background (SimplyBook body_bg_color) */
  --accent:#861657;    /* plum base colour (SimplyBook sb_base_color) */
  --accent-dark:#6d1246;
  --beige-btn:#d9c7b8; /* SimplyBook btn_color_1 */
  --font-body:"Nunito", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-script:"Allison", cursive;
  --font-serif:Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  color:var(--ink);
  background:var(--paper);
}
a{color:var(--accent)}

/* ============================================================
   STICKY NAV — brand + jump links + Book Now button
   ============================================================ */
.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1140px;
  margin:0 auto;
  padding:12px 24px;
  display:grid;
  grid-template-columns:1fr auto 1fr;   /* brand | links | button */
  align-items:center;
  gap:16px;
}
.nav-brand{
  font-family:var(--font-script);
  font-weight:400;
  font-size:34px;
  line-height:1;
  color:var(--ink);
  white-space:nowrap;
  text-align:left;
  justify-self:start;
  align-self:baseline;   /* script sits on the same text line as the menu links */
}
.nav-links{align-self:baseline}
.nav-inner .book-btn{justify-self:end}
.nav-links{
  display:flex;
  flex-wrap:wrap;
  gap:22px;
  font-size:14px;
  font-weight:700;
  letter-spacing:0;
  text-transform:none;
}
.nav-links a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:2px solid transparent;
  padding-bottom:2px;
}
.nav-links a:hover{color:var(--accent); border-bottom-color:var(--accent)}
.book-btn{
  background:var(--accent);
  color:#fff;
  font-size:14px;
  font-weight:600;
  letter-spacing:0;
  text-transform:none;
  text-decoration:none;
  padding:11px 22px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  border-radius:8px;
  white-space:nowrap;
}
.book-btn:hover{background:var(--accent-dark)}

/* ============================================================
   HERO — identical to the booking page banner:
   same image file (1920 x 600 export), 600px tall box,
   background-size cover, centred. 570px tall on phones.
   ============================================================ */
.hero{
  position:relative;
  width:100%;
  min-height:600px;
  background:url("hero-banner.png") center center / cover no-repeat #bfe3ea;
}

/* ============================================================
   HOME TABS — white bar under the photo, like the booking page.
   The single tab is drawn as the active tab (5px plum line) but is
   plain text, not a link.
   ============================================================ */
.home-tabs{
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.home-tabs-inner{
  max-width:1140px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
}
/* one tab = the left half, as each of the two tabs is half width on the booking page */
.home-tab{
  position:relative;
  display:block;
  flex:0 0 50%;
  width:50%;
  min-width:180px;
  margin:0;
  padding:33px 0;
  text-align:center;
  font-family:var(--font-body);
  font-size:16px;
  font-weight:600;
  line-height:1.4;
  color:var(--ink);
  cursor:default;
  user-select:none;
}
.home-tab.active::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:5px;
  background:var(--accent);
}
.home-tabs .eyebrow,
.home-tabs .hero-subtitle{flex:0 0 100%; text-align:left}
.home-tabs .eyebrow{
  padding-top:18px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
}
.home-tabs .hero-subtitle{
  margin:0;
  padding:18px 0 22px;
  font-size:16px;
  line-height:1.6;
  max-width:640px;
  color:var(--muted);
}
[hidden]{display:none !important}

/* ============================================================
   MENU SECTIONS
   ============================================================ */
.menu{
  max-width:1140px;
  margin:0 auto;
  padding:0 24px;
}
.section{
  padding:52px 0 44px;
  border-bottom:1px solid var(--line);
  scroll-margin-top:84px;
}
.section:last-of-type{border-bottom:none}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}
.section-head h2{
  font-family:var(--font-script);
  font-weight:400;
  font-size:48px;
  line-height:1.2;
  margin:0;
  color:var(--ink);
}
.section-head .count{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
/* group bands — same look as the category headers on the booking page */
.subhead{
  font-family:var(--font-body);
  font-size:16px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  line-height:1.5;
  margin:28px 0 18px;
  padding:14px 16px;
  background:var(--soft);
  color:var(--ink);
  border-left:3px solid var(--accent);
  border-radius:6px;
}
.subhead:first-child{margin-top:0}
table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
td{
  padding:16px 0;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  line-height:1.5;
}
td strong{
  font-weight:700;
  font-size:16px;
  color:#442b36;
}
tr:last-child td{border-bottom:none}
td.price{
  text-align:right;
  white-space:nowrap;
  padding-left:18px;
  font-weight:600;
  color:var(--ink);
}
.desc{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
  max-width:640px;
}
.note{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.placeholder{
  padding:8px 0 2px;
  color:var(--muted);
  font-style:italic;
  font-size:15px;
}

/* ============================================================
   FOOTER
   ============================================================ */
footer{
  text-align:center;
  background:var(--soft);
  border-top:1px solid var(--line);
  padding:40px 18px;
  font-size:14px;
  line-height:1.7;
  color:var(--ink);
}
footer .foot-book{
  display:inline-block;
  margin-top:14px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  letter-spacing:0;
  text-transform:none;
  padding:12px 24px;
  border-radius:8px;
}
footer .foot-book:hover{background:var(--accent-dark)}

/* focus ring, as on the booking page */
a:focus-visible{outline:3px solid var(--accent); outline-offset:4px}

/* ============================================================
   MOBILE
   ============================================================ */
@media(max-width:767px){
  .hero{min-height:570px}
}
@media(max-width:700px){
  .nav-inner{grid-template-columns:1fr auto; padding:12px 16px}
  .nav-brand{font-size:30px; grid-row:1; grid-column:1}
  .nav-inner .book-btn{grid-row:1; grid-column:2}
  .nav-links{
    grid-row:2;
    grid-column:1 / -1;
    width:100%;
    gap:12px 16px;
    font-size:13px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .home-tabs-inner{padding:0 16px}
  .home-tab{padding:12px 0; min-height:48px}
  .section{padding:38px 0 32px}
  .section-head h2{font-size:38px}
  .subhead{font-size:14px; letter-spacing:.06em; padding:12px; margin-top:18px}
  table{font-size:15px}
  td strong{font-size:16px}
  td.price{padding-left:12px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">idresshair by Jurga</div>
    <div class="nav-links" id="nav-links"></div>
    <a class="book-btn" id="book-btn-top" href="https://wa.me/971566579902" target="_blank" rel="noopener">Book Now</a>
  </div>
</nav>

<section class="hero" id="hero"></section>

<!-- Tab bar under the photo, same look as the booking page's home tabs.
     The tab text still comes from the Hero Banner "Big Title" in the admin panel. -->
<div class="home-tabs">
  <div class="home-tabs-inner">
    <div class="eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-title" class="home-tab active"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
  </div>
</div>

<main class="menu" id="menu"></main>

<footer>
  idresshair • Mira, Dubai<br>
Hair Services &amp; Prices
  <br>
  <a class="foot-book" id="book-btn-bottom" href="#">Book Your Appointment</a>
</footer>

<script>
/* ============================================================
   This script reads data/menu.json and builds the page.
   To change prices/services, DO NOT edit this file —
   edit data/menu.json directly, or use the /admin panel.
   ============================================================ */
async function buildMenu(){
  const res = await fetch('data/menu.json', { cache: 'no-store' });
  const data = await res.json();

  // Hero
  const eyebrowEl = document.getElementById('hero-eyebrow');
  const subtitleEl = document.getElementById('hero-subtitle');
  eyebrowEl.textContent = data.hero.eyebrow || '';
  document.getElementById('hero-title').textContent = data.hero.title || '';
  subtitleEl.textContent = data.hero.subtitle || '';
  eyebrowEl.hidden = !eyebrowEl.textContent.trim();
  subtitleEl.hidden = !subtitleEl.textContent.trim();

  // Book buttons: the header button is a WhatsApp link (set in the HTML above);
  // the footer button opens the online booking page from data/menu.json
  document.getElementById('book-btn-bottom').href = data.bookUrl || 'https://idresshair.simplybook.me';

  // Nav links (built from sections, so a new section you add in the CMS
  // automatically gets a nav link too)
  const navEl = document.getElementById('nav-links');
  navEl.innerHTML = data.sections.map(function(s){
    return '<a href="#' + s.id + '">' + s.title + '</a>';
  }).join('');

  // Sections
  const menuEl = document.getElementById('menu');
  menuEl.innerHTML = data.sections.map(function(section){
    let itemCount = 0;
    (section.groups || []).forEach(function(g){ itemCount += (g.items || []).length; });

    let html = '<section class="section" id="' + section.id + '">';
    html += '<div class="section-head"><h2>' + section.title + '</h2>';
    if(itemCount > 0){
      html += '<span class="count">' + itemCount + (itemCount === 1 ? ' service' : ' services') + '</span>';
    }
    html += '</div>';

    (section.groups || []).forEach(function(group){
      if(group.subhead){
        html += '<div class="subhead">' + group.subhead + '</div>';
      }
      html += '<table>';
      (group.items || []).forEach(function(item){
        html += '<tr><td><strong>' + item.name + '</strong>' +
          (item.desc ? '<span class="desc">' + item.desc + '</span>' : '') +
          '</td><td class="price">' + item.price + '</td></tr>';
      });
      html += '</table>';
    });

    if(itemCount === 0 && section.placeholder){
      html += '<div class="placeholder">' + section.placeholder + '</div>';
    }

    if(section.note){
      html += '<div class="note">' + section.note + '</div>';
    }

    html += '</section>';
    return html;
  }).join('');
}

buildMenu();
</script>

</body>
</html>
