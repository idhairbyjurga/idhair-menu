<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idresshair by Jurga — Services</title>
   <meta property="og:title" content="idresshair by Jurga — Services">
<meta property="og:description" content="Hair Personally Addressed">
<meta property="og:image" content="https://idresshair.netlify.app/menu-new-image.png">
<meta property="og:url" content="https://idresshair.netlify.app/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F5F1E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Bodoni Moda is only a stand-in for Didot on devices that don't have Didot built in
     (Apple devices have it, so they show the same Didot as the PDF menu) -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STYLE MATCHED TO THE PDF MENU (iDHair - Complete Menu, Nov 2026)
   cream page, burgundy text, Didot headings, Arial text.
   COLORS — edit these lines to change the whole site's palette
   ============================================================ */
:root{
  --paper:#F5F1E8;     /* page background (PDF cream) */
  --ink:#8A031A;       /* all text, lines and buttons (PDF burgundy) */
  --ink-dark:#6E0215;  /* button hover */
  --on-ink:#FBF0E1;    /* text on burgundy buttons (PDF cream lettering) */
  --line:#E2C6C3;      /* thin dividing lines */
  --font-serif:"Didot", "Didot LT STD", "Bodoni Moda", "Bodoni 72", Georgia, serif;
  --font-body:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --pc:76px;           /* width of each price column (Short / Medium / Long) */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  color:var(--ink);
  background:var(--paper);
}
a{color:var(--ink)}
[hidden]{display:none !important}

/* shared button looks */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:44px;
  padding:11px 20px;
  border:1px solid var(--ink);
  border-radius:2px;
  font-family:var(--font-body);
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-decoration:none;
  white-space:nowrap;
  line-height:1.2;
}
.btn-solid{background:var(--ink); color:var(--on-ink)}
.btn-solid:hover{background:var(--ink-dark); border-color:var(--ink-dark)}

/* ============================================================
   STICKY NAV — brand + jump links + Book Now button
   ============================================================ */
.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(245,241,232,.95);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1140px;
  margin:0 auto;
  padding:10px 24px;
  display:grid;
  grid-template-columns:auto 1fr auto;   /* brand | links | button */
  align-items:center;
  gap:16px;
}
/* Logo: the "iDHair" letters (not the waves above them) are lined up with the
   menu text and the Book Now button. The letters' centre is 74% down the logo,
   so the logo is raised by 24% of its height (46px tall -> 11px). */
.nav-brand{
  display:flex;
  align-items:center;
  min-height:68px;
}
.nav-brand img{
  display:block;
  height:46px;
  width:auto;
  transform:translateY(-11px);
}
.nav-links{
  display:flex;
  justify-content:center;
  gap:20px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  white-space:nowrap;
}
.nav-links a{
  text-decoration:none;
  border-bottom:1px solid transparent;
  padding:4px 0 3px;
}
.nav-links a:hover{border-bottom-color:var(--ink)}

/* ============================================================
   HERO — identical to the booking page banner:
   same image file (1920 x 600 export), 600px tall box,
   background-size cover, centred. 570px tall on phones.
   ============================================================ */
.hero{
  position:relative;
  width:100%;
  min-height:600px;
  background:url("hero-banner.png") center center / cover no-repeat #bfe3ea;
  overflow:hidden;
}
/* vector lettering, cropped and scaled exactly like the background photo */
.hero .hero-text{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center center;
  pointer-events:none; user-select:none;
}

/* ============================================================
   HOME TABS — bar under the photo. The single title tab fills the
   left half and is drawn as the active tab (plain text, not a link).
   ============================================================ */
.home-tabs{
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.home-tabs-inner{
  max-width:1140px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
}
.home-tab{
  position:relative;
  display:block;
  flex:0 0 50%;
  width:50%;
  min-width:180px;
  margin:0;
  padding:30px 0;
  text-align:center;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  line-height:1.4;
  color:var(--ink);
  cursor:default;
  user-select:none;
}
.home-tab.active::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:3px;
  background:var(--ink);
}
.home-tabs .eyebrow,
.home-tabs .hero-subtitle{flex:0 0 100%; text-align:left}
.home-tabs .eyebrow{
  padding-top:18px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.home-tabs .hero-subtitle{
  margin:0;
  padding:18px 0 22px;
  font-size:16px;
  line-height:1.6;
  max-width:640px;
}

/* ============================================================
   MENU — laid out like the PDF pages
   ============================================================ */
.menu{
  max-width:880px;
  margin:0 auto;
  padding:0 24px;
}
.welcome{
  margin:0;
  padding-top:56px;
  text-align:center;
  font-family:var(--font-serif);
  font-size:22px;
  letter-spacing:.04em;
}
.foot-note{
  margin:26px 0 0;
  text-align:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.section{
  padding:52px 0 48px;
  scroll-margin-top:96px;
}
/* short centred line between sections, like the line under the PDF logo */
.section + .section::before{
  content:"";
  display:block;
  width:140px;
  height:1px;
  margin:0 auto 52px;
  background:var(--ink);
  opacity:.55;
}
.section h2{
  margin:0 0 34px;
  text-align:center;
  font-family:var(--font-serif);
  font-weight:400;
  font-size:54px;
  line-height:1.1;
  letter-spacing:.02em;
  text-transform:uppercase;
}

/* a service group: heading row (title + SHORT / MEDIUM / LONG) then the rows */
.group{margin-top:34px}
.group:first-of-type{margin-top:0}
.group-head,
.item{
  display:grid;
  grid-template-columns:minmax(0,1fr) repeat(3, var(--pc));
  column-gap:12px;
}
.group-head{
  align-items:end;
  margin-bottom:12px;
}
.subhead{
  grid-column:1;
  margin:0;
  font-family:var(--font-serif);
  font-weight:400;
  font-size:30px;
  line-height:1.15;
  letter-spacing:.03em;
  text-transform:uppercase;
}
.col-label.c2{grid-column:2}
.col-label.c3{grid-column:3}
.col-label.c4{grid-column:4}
.col-label{
  grid-row:1;
  text-align:center;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding-bottom:5px;
}
.item{
  padding:13px 0;
  align-items:baseline;
}
.item .name{
  grid-column:1;
  font-size:15px;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.item .p{
  text-align:center;
  font-size:15px;
  white-space:nowrap;
}
/* a single price (or FREE) is centred across the Short / Medium / Long columns */
.item .p-all{grid-column:2 / -1}
.item .desc{
  grid-column:1;
  margin-top:3px;
  max-width:560px;
  font-size:13.5px;
  line-height:1.55;
}
.note{
  max-width:560px;
  margin:30px auto 0;
  text-align:center;
  font-size:12.5px;
  line-height:1.65;
}
.placeholder{
  text-align:center;
  font-size:15px;
  font-style:italic;
}

/* ============================================================
   ABOUT
   ============================================================ */
.about-points{
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:28px;
  margin-top:56px;
}
.about-point{text-align:center}
.about-point h3{
  margin:0 0 10px;
  font-family:var(--font-serif);
  font-weight:400;
  font-size:21px;
  line-height:1.2;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.about-point p{
  margin:0;
  font-size:14px;
  line-height:1.65;
}

/* ============================================================
   ABOUT — heading + text on the left, photo on the right,
   the three highlights in columns underneath
   ============================================================ */
.split-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:56px;
  align-items:center;
}
.split-text h2{
  text-align:left;
  font-size:42px;
  margin-bottom:22px;
}
.split-text p{
  margin:0 0 14px;
  font-size:16px;
  line-height:1.75;
}
.split-text p:last-child{margin-bottom:0}
.photo{
  aspect-ratio:4 / 5;
  border-radius:60px;        /* rounded corners, 60px */
  overflow:hidden;
  background:#EAD9D3;        /* light burgundy tint while there is no photo */
}
.photo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.photo-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:rgba(138,3,26,.55);
  font-size:11px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.photo-empty svg{width:44px; height:44px}

/* ============================================================
   LOCATION — area on the left, map on the right
   ============================================================ */
.location-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);
  gap:48px;
  align-items:center;
}
.location h2{
  text-align:left;
  font-size:46px;
  margin-bottom:18px;
}
.location-area{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:17px;
}
.location-area svg{width:24px; height:24px; flex:none}
.location-link{
  display:inline-block;
  margin-top:16px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  text-decoration:none;
  border-bottom:1px solid var(--ink);
  padding-bottom:2px;
}
.map{
  height:420px;
  border-radius:24px;        /* small enough to keep Google's map labels visible */
  overflow:hidden;
  background:#EAD9D3;
}
.map iframe{display:block; width:100%; height:100%; border:0}

/* visually hidden, still read by screen readers */
.sr-only{
  position:absolute;
  width:1px; height:1px;
  margin:-1px; padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

/* ============================================================
   FOOTER — logo as on the PDF pages, then the buttons
   ============================================================ */
footer{
  text-align:center;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:56px 18px 48px;
  font-size:13px;
  line-height:1.7;
}
.foot-logo{
  display:block;
  width:242px;
  max-width:62%;
  height:auto;
  margin:0 auto;
}
.foot-buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:28px;
}

/* focus ring */
a:focus-visible{outline:2px solid var(--ink); outline-offset:4px}

/* ============================================================
   SMALLER SCREENS
   ============================================================ */
@media(max-width:1080px){
  .nav-inner{grid-template-columns:1fr auto; row-gap:8px}
  .nav-brand{grid-row:1; grid-column:1}
  .nav-inner .book-btn{grid-row:1; grid-column:2}
  .nav-links{
    grid-row:2;
    grid-column:1 / -1;
    justify-content:flex-start;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, #000 88%, transparent);
            mask-image:linear-gradient(to right, #000 88%, transparent);
  }
  .nav-links::-webkit-scrollbar{display:none}
  .section{scroll-margin-top:124px}
}
@media(max-width:767px){
  .hero{min-height:570px}
}
@media(max-width:700px){
  :root{--pc:50px}
  .nav-inner{padding:10px 16px}
  .nav-brand{min-height:58px}
  .nav-brand img{height:38px; transform:translateY(-9px)}
  .nav-links{gap:18px; font-size:11px}
  .nav-inner .book-btn{padding:10px 14px}
  .home-tabs-inner{padding:0 16px}
  .home-tab{padding:12px 0; min-height:48px; display:flex; align-items:center; justify-content:center}
  .menu{padding:0 16px}
  .welcome{padding-top:40px; font-size:20px}
  .section{padding:40px 0 36px}
  .section + .section::before{margin-bottom:40px}
  .section h2{font-size:34px; margin-bottom:26px}
  /* phones: group title gets its own line, column labels go on the row below */
  .subhead{grid-column:1 / -1; font-size:22px; margin-bottom:10px}
  .col-label{grid-row:2; font-size:9.5px; letter-spacing:.03em}
  .item{column-gap:8px}
  .item .name{font-size:14px; letter-spacing:.01em}
  .item .p{font-size:14px}
  .item .desc{grid-column:1 / -1; font-size:13px}
  .about-points{grid-template-columns:1fr; gap:26px; margin-top:36px}
  .split-grid{grid-template-columns:1fr; gap:30px}
  .split-text h2{text-align:center; font-size:32px}
  .split-text p{font-size:15px}
  .photo{width:100%; max-width:420px; margin:0 auto}
  .location-grid{grid-template-columns:1fr; gap:24px}
  .location h2{text-align:center; font-size:34px; margin-bottom:12px}
  .location-text{text-align:center}
  .location-area{justify-content:center; font-size:16px}
  .map{height:320px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <!-- clicking the logo scrolls back to the top of the page -->
    <a class="nav-brand" href="#top" title="Back to top"><img src="logo-idhair-mark.svg" alt="iDHair — i.dresshair by Jurga, back to top" width="90" height="44"></a>
    <div class="nav-links" id="nav-links"></div>
    <a class="btn btn-solid book-btn" id="book-btn-top" href="https://wa.me/971566579902" target="_blank" rel="noopener">Book Now</a>
  </div>
</nav>

<section class="hero" id="hero">
  <!-- Brand lettering redrawn as vector so it stays sharp; the photo itself is untouched -->
  <img class="hero-text" src="hero-text.svg" alt="i.dresshair by Jurga – iDHair">
</section>

<!-- Tab bar under the photo, same look as the booking page's home tabs.
     The tab text still comes from the Hero Banner "Big Title" in the admin panel. -->
<div class="home-tabs">
  <div class="home-tabs-inner">
    <div class="eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-title" class="home-tab active"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
  </div>
</div>

<main class="menu" id="menu"></main>

<footer>
  <!-- Logo, line and "i.dresshair by Jurga" exactly as on the PDF pages (one vector file) -->
  <img class="foot-logo" src="logo-idhair.svg" alt="iDHair — i.dresshair by Jurga" width="242" height="186">
  <div class="foot-buttons">
    <a class="btn btn-solid" id="book-btn-bottom" href="https://idresshair.simplybook.me">Book Your Appointment</a>
  </div>
  <p class="foot-note">All prices in AED</p>
</footer>

<script>
/* ============================================================
   This script reads data/menu.json and builds the page.
   To change prices/services, DO NOT edit this file —
   edit data/menu.json directly, or use the /admin panel.
   ============================================================ */

// "120 / 140 / 160 AED" -> three columns (Short / Medium / Long);
// anything else ("60 AED", "FREE") -> one value centred across the three columns.
// "AED" is not shown next to prices: the page says "All prices in AED" once at the top.
function splitPrice(price){
  var clean = String(price || '').replace(/\s*AED\s*$/i, '').trim();
  var parts = clean.split('/').map(function(s){ return s.trim(); });
  return parts.length === 3 ? parts : [clean];
}

async function buildMenu(){
  const res = await fetch('data/menu.json', { cache: 'no-store' });
  const data = await res.json();

  // Hero
  const eyebrowEl = document.getElementById('hero-eyebrow');
  const subtitleEl = document.getElementById('hero-subtitle');
  eyebrowEl.textContent = data.hero.eyebrow || '';
  document.getElementById('hero-title').textContent = data.hero.title || '';
  subtitleEl.textContent = data.hero.subtitle || '';
  eyebrowEl.hidden = !eyebrowEl.textContent.trim();
  subtitleEl.hidden = !subtitleEl.textContent.trim();

  // Book buttons: the header button is a WhatsApp link (set in the HTML above);
  // the footer button opens the online booking page from data/menu.json
  document.getElementById('book-btn-bottom').href = data.bookUrl || 'https://idresshair.simplybook.me';

  const about = data.about && data.about.title ? data.about : null;

  // Nav links in page order: About, then the price sections (built from the
  // sections, so a new section you add in the CMS automatically gets a link)
  const navEl = document.getElementById('nav-links');
  navEl.innerHTML = (about ? '<a href="#about">' + about.title + '</a>' : '') +
    data.sections.map(function(s){
      return '<a href="#' + s.id + '">' + s.title + '</a>';
    }).join('');

  // Welcome line
  let html = '';
  if (data.welcome && data.welcome.trim()) {
    html += '<p class="welcome">· ' + data.welcome.trim() + ' ·</p>';
  }

  // About (between the welcome line and the services):
  // heading + intro on the left, photo on the right, then the three highlights below.
  // The header link uses about.title ("About"); the page shows about.heading.
  if (about) {
    const heading = about.heading || about.title;
    html += '<section class="section about" id="about"><div class="split-grid">';
    html += '<div class="split-text"><h2>' + heading + '</h2>' +
      String(about.intro || '').split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){
        return '<p>' + p.trim() + '</p>';
      }).join('') + '</div>';
    html += about.image
      ? '<div class="photo"><img src="' + about.image + '" alt="' + heading + '"></div>'
      : '<div class="photo photo-empty" aria-hidden="true">' +
          '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">' +
          '<rect x="6" y="10" width="36" height="28" rx="4"/><circle cx="17" cy="20" r="3.5"/><path d="M6 33l11-9 8 7 6-5 11 9"/></svg>' +
          'Photo</div>';
    html += '</div>';
    if (about.points && about.points.length) {
      html += '<div class="about-points">' + about.points.map(function(pt){
        return '<div class="about-point"><h3>' + pt.title + '</h3><p>' + pt.text + '</p></div>';
      }).join('') + '</div>';
    }
    html += '</section>';
  }

  // Price sections
  html += data.sections.map(function(section){
    let itemCount = 0;
    (section.groups || []).forEach(function(g){ itemCount += (g.items || []).length; });

    let out = '<section class="section" id="' + section.id + '">';
    out += '<h2>' + section.title + '</h2>';

    (section.groups || []).forEach(function(group){
      const items = group.items || [];
      const threeCols = items.some(function(it){ return splitPrice(it.price).length === 3; });

      out += '<div class="group">';
      if (group.subhead || threeCols) {
        out += '<div class="group-head">';
        out += group.subhead ? '<h3 class="subhead">' + group.subhead + '</h3>' : '<span></span>';
        if (threeCols) {
          out += '<span class="col-label c2">Short</span><span class="col-label c3">Medium</span><span class="col-label c4">Long</span>';
        }
        out += '</div>';
      }

      items.forEach(function(item){
        const prices = splitPrice(item.price);
        out += '<div class="item"><div class="name">' + item.name + '</div>';
        out += prices.length === 3
          ? prices.map(function(p){ return '<div class="p">' + p + '</div>'; }).join('')
          : '<div class="p p-all">' + prices[0] + '</div>';
        if (item.desc) out += '<div class="desc">' + item.desc + '</div>';
        out += '</div>';
      });
      out += '</div>';
    });

    if(itemCount === 0 && section.placeholder){
      out += '<div class="placeholder">' + section.placeholder + '</div>';
    }

    if(section.note){
      out += '<div class="note">' + section.note + '</div>';
    }

    out += '</section>';
    return out;
  }).join('');

  // Location: area text left, Google map right (area only, no street address)
  const loc = data.location && data.location.mapQuery ? data.location : null;
  if (loc) {
    const q = encodeURIComponent(loc.mapQuery);
    html += '<section class="section location" id="location"><div class="location-grid">';
    html += '<div class="location-text"><h2>' + (loc.title || 'Location') + '</h2>' +
      '<p class="location-area"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
      '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>' +
      '<span>' + (loc.area || loc.mapQuery) + '</span></p>' +
      '<a class="location-link" href="https://www.google.com/maps/search/?api=1&amp;query=' + q + '" target="_blank" rel="noopener">Open in Google Maps</a></div>';
    html += '<div class="map"><iframe title="Map: ' + (loc.area || loc.mapQuery) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen ' +
      'src="https://maps.google.com/maps?q=' + q + '&amp;z=' + (loc.zoom || 13) + '&amp;output=embed"></iframe></div>';
    html += '</div></section>';
  }

  document.getElementById('menu').innerHTML = html;
}

buildMenu();
</script>

</body>
</html>
